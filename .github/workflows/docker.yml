name: Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Build the image and sanity-check that the binary runs.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vncsnatch:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Binary runs (--help)
        run: docker run --rm vncsnatch:ci --help

      - name: Binary is static
        run: |
          docker run --rm --entrypoint sh vncsnatch:ci -c \
            'ldd /usr/local/bin/vncsnatch 2>&1 | grep -q "Not a valid dynamic program"'

  # Compile and run the standalone CSV parser unit tests (no network, no scan).
  parser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Run parser tests
        run: |
          cd tests
          gcc -Wall -Wextra -o parser_tests test_csv_parser.c
          ./parser_tests

  # Verify the entrypoint's auto-download works end to end (no scan): the
  # "fetch-db" command downloads from the default sources into the cache.
  download-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vncsnatch:ci

      - name: Entrypoint downloads a database
        run: |
          mkdir -p data
          docker run --rm -v "$PWD/data:/data" vncsnatch:ci fetch-db
          test -s data/ip-country.csv
          grep -q ",AD" data/ip-country.csv

      - name: DB_URL_EXTRA is tried first
        run: |
          rm -rf data && mkdir -p data
          # A bad extra source must fall through to the working defaults.
          docker run --rm -v "$PWD/data:/data" \
            -e DB_URL_EXTRA="https://127.0.0.1:1/nope.csv" \
            vncsnatch:ci fetch-db
          test -s data/ip-country.csv
