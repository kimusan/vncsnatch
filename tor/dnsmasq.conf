# dnsmasq as a local DNS forwarder for the Tor gateway.
# Listens on :53 and forwards every query to tor's DNSPort (127.0.0.1:9053).
# Because it listens locally, redirected client DNS reaches it without the
# UDP NAT round-trip that some container runtimes (e.g. Docker Desktop on
# Windows/WSL2) mishandle.
no-resolv
no-hosts
server=127.0.0.1#9053
listen-address=0.0.0.0
bind-interfaces
# Keep it quiet; uncomment to debug.
#log-queries
